# Bundle layer contributed by perse-cua.
#
# Applied when the package is listed in a profile's `package.json` under
# `dsh.profile.bundles`. A profile may equivalently insert the same row from its
# own cordis.patch.yml; do ONE of the two, never both — the loader id must be
# unique (preflight rule R-07).
#
# On macOS this row defaults to the native `cua` provider. On other platforms,
# or with `backend: mcp`, it owns the external driver connection. Do not add a
# second MCP row for the same driver.
- insert:
    - id: perse-cua
      name: perse-cua
      description: Desktop automation with native macOS and external MCP backends
